<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中継車 位置送信</title>
<style>
  :root{
    --bg:#0a0e13;--panel:#0f151c;--line:#1e2833;--amber:#ff8a3d;
    --cyan:#2fe0c5;--text:#e6ecf0;--sub:#6b7885;--danger:#ff4d4d;
    --mono:"SF Mono","JetBrains Mono",Consolas,monospace;
    --sans:-apple-system,"Hiragino Sans","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100dvh;background:var(--bg);color:var(--text);
    font-family:var(--sans);display:flex;flex-direction:column;
    padding:env(safe-area-inset-top,20px) 20px calc(env(safe-area-inset-bottom,20px)+20px);
  }
  h1{font-size:15px;letter-spacing:.1em;color:var(--sub);text-transform:uppercase;margin:8px 0 20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .card .label{font-size:11px;color:var(--sub);letter-spacing:.08em;margin-bottom:6px;text-transform:uppercase;}
  .card input{
    width:100%;background:#070a0d;border:1px solid var(--line);border-radius:8px;
    color:var(--text);font-family:var(--mono);font-size:13px;padding:10px;
  }
  .value{font-family:var(--mono);font-size:22px;font-weight:700;}
  .value.dim{color:var(--sub);font-size:14px;font-weight:400;}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sub);margin-right:6px;}
  .status-dot.ok{background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
  .status-dot.bad{background:var(--danger);}
  .btn{
    background:var(--amber);color:#1a0f05;border:none;border-radius:14px;
    padding:16px;font-size:16px;font-weight:700;margin-top:auto;
  }
  .btn.stop{background:#2a3540;color:var(--text);}
  .log{font-family:var(--mono);font-size:11px;color:var(--sub);margin-top:10px;line-height:1.7;max-height:120px;overflow-y:auto;}
</style>
</head>
<body>
  <h1>📡 中継車 位置送信</h1>

  <div class="card">
    <div class="label">送信先 GAS Web App URL</div>
    <input type="text" id="url" placeholder="https://script.google.com/macros/s/.../exec" value="https://script.google.com/macros/s/AKfycbyhNrX4tWElZ-NhKXnrPWsSdxmK05gT3cCs7YgDqhtgIcjLAls6jP5-LZkgJ2fHNcEgiw/exec">
  </div>

  <div class="card">
    <div class="label"><span class="status-dot" id="dot"></span>現在地</div>
    <div class="value" id="posValue">未取得</div>
    <div class="value dim" id="accValue"></div>
  </div>

  <div class="card">
    <div class="label">送信ログ</div>
    <div class="log" id="log">まだ送信していません</div>
  </div>

  <button class="btn" id="toggleBtn">送信を開始</button>

<script>
  const $ = id => document.getElementById(id);
  let watchId = null, sendTimer = null, sending = false;
  let curLat = null, curLon = null;

  function log(msg){
    const el = $('log');
    const t = new Date().toLocaleTimeString('ja-JP');
    el.innerHTML = `[${t}] ${msg}<br>` + el.innerHTML;
  }

  function onPos(pos){
    curLat = pos.coords.latitude;
    curLon = pos.coords.longitude;
    $('dot').classList.add('ok');
    $('posValue').textContent = curLat.toFixed(5) + ', ' + curLon.toFixed(5);
    $('accValue').textContent = '精度 ±' + Math.round(pos.coords.accuracy) + 'm';
  }
  function onPosErr(err){
    $('dot').classList.add('bad');
    log('GPS エラー: ' + err.message);
  }

  // ---- Wake Lock: 送信中は画面が自動で消えないようにする ----
  let wakeLock = null;
  async function requestWakeLock(){
    if(!('wakeLock' in navigator)){
      log('この端末/ブラウザはWake Lockに対応していません（手動で画面ロックをオフにしてください）');
      return;
    }
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      log('画面スリープを防止しました');
      wakeLock.addEventListener('release', ()=>{
        log('画面スリープ防止が解除されました');
      });
    }catch(err){
      log('画面スリープ防止に失敗: ' + err.message);
    }
  }
  function releaseWakeLock(){
    if(wakeLock){
      wakeLock.release();
      wakeLock = null;
    }
  }
  // アプリを他画面に切り替えて戻ってきたとき、送信中なら再取得する
  document.addEventListener('visibilitychange', function(){
    if(sending && document.visibilityState === 'visible' && wakeLock === null){
      requestWakeLock();
    }
  });

  async function sendOnce(){
    if(curLat === null) return;
    const url = $('url').value.trim();
    if(!url) return;
    try{
      await fetch(url, {
        method: 'POST',
        body: JSON.stringify({ lat: curLat, lon: curLon })
      });
      log('送信OK: ' + curLat.toFixed(5) + ', ' + curLon.toFixed(5));
    }catch(err){
      log('送信エラー: ' + err.message);
    }
  }

  $('toggleBtn').addEventListener('click', function(){
    if(!sending){
      const url = $('url').value.trim();
      if(!url){ alert('GAS Web AppのURLを入力してください'); return; }
      watchId = navigator.geolocation.watchPosition(onPos, onPosErr, {enableHighAccuracy:true, maximumAge:1000});
      sendTimer = setInterval(sendOnce, 5000);
      sending = true;
      this.textContent = '送信を停止';
      this.classList.add('stop');
      log('送信を開始しました（5秒おき）');
      requestWakeLock();
    } else {
      if(watchId) navigator.geolocation.clearWatch(watchId);
      if(sendTimer) clearInterval(sendTimer);
      sending = false;
      this.textContent = '送信を開始';
      this.classList.remove('stop');
      log('送信を停止しました');
      releaseWakeLock();
    }
  });
</script>
</body>
</html>
